# Optional local vector service. Supply QDRANT_API_KEY in the shell or --env-file.
# Future external vector option only; the current local assistant uses encrypted SQLite.
services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set a strong QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - paydesk_vectors:/qdrant/storage
volumes:
  paydesk_vectors:
